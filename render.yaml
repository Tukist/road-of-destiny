services:
  - type: web
    name: road-of-destiny
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: mkdir -p data && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/game.db
